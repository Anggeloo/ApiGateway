name: CI/CD to EC2 - API Gateway

on:
  push:
    branches: [ "QA" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t anggeloo/apigateway:latest .

      - name: Push Docker Image
        run: docker push anggeloo/apigateway:latest

  deploy-to-ec2:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # Eliminar contenedor anterior
            docker stop apigateway_container || true
            docker rm apigateway_container || true

            # Eliminar imágenes antiguas
            docker rmi $(docker images -q anggeloo/apigateway) || true

            # Descargar la nueva imagen
            docker pull anggeloo/apigateway:latest

            # Ejecutar nuevo contenedor con archivos de configuración
            docker run -d --name apigateway_container \
              -p 5050:5050 \
              -v /home/ubuntu/configs/ocelot-prod.json:/app/ocelot-prod.json \
              -v /home/ubuntu/configs/appsettings.json:/app/appsettings.json \
              anggeloo/apigateway:latest

            # Verificar si el contenedor está corriendo
            docker ps

            # Mostrar logs iniciales del contenedor (para depuración)
            docker logs apigateway_container
